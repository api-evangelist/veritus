aid: veritus
name: Veritus
description: >-
  Veritus (Veritus Agent) is a San Francisco fintech (Y Combinator S2025) building
  compliant, voice-first AI agents for the consumer-lending lifecycle - origination,
  servicing, and collections. Its omnichannel platform places AI voice calls, SMS,
  and email to borrowers, running every contact through a built-in compliance engine
  (respectful hours, frequency limits, cease-and-desist, model-validation notices)
  before outreach. The REST API (OpenAPI 3.1, bearer auth, isolated sandbox and
  production environments, HMAC-signed webhooks) lets lenders, servicers, and
  collections agencies create customers, place compliance-checked calls, run
  omnichannel drip campaigns, import and analyze SMS/email interactions, and
  retrieve call recordings.
